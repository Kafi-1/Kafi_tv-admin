name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Build APK
        run: |
          set -e
          PROJECT="."
          BUILD="./build_output"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          OUTPUT_APK="./TVAdmin.apk"

          rm -rf "$BUILD"
          mkdir -p "$BUILD/gen" "$BUILD/obj" "$BUILD/dex" "$BUILD/apk" "$BUILD/compiled"

          echo "[1/6] AAPT2 - Compiling resources..."
          find "$PROJECT/res" \( -name "*.xml" -o -name "*.png" -o -name "*.jpg" \) | while read f; do
              $BUILD_TOOLS/aapt2 compile -o "$BUILD/compiled" "$f"
          done

          echo "[2/6] AAPT2 - Linking resources..."
          COMPILED_FILES=$(find "$BUILD/compiled" -name "*.flat" -type f | tr '\n' ' ')
          $BUILD_TOOLS/aapt2 link \
              -o "$BUILD/apk/base.apk" \
              -I "$ANDROID_JAR" \
              --manifest "$PROJECT/AndroidManifest.xml" \
              --java "$BUILD/gen" \
              --auto-add-overlay \
              $COMPILED_FILES

          echo "[3/6] JAVAC - Compiling Java..."
          find "$BUILD/gen" -name "*.java" > "$BUILD/sources.txt"
          find "$PROJECT/src" -name "*.java" >> "$BUILD/sources.txt"
          javac -source 1.8 -target 1.8 \
              -classpath "$ANDROID_JAR" \
              -d "$BUILD/obj" \
              @"$BUILD/sources.txt"

          echo "[4/6] D8 - Creating DEX..."
          $BUILD_TOOLS/d8 --output "$BUILD/dex" $(find "$BUILD/obj" -name "*.class") --lib "$ANDROID_JAR"

          echo "[5/6] Adding DEX to APK..."
          cd "$BUILD/apk"
          cp "$BUILD/dex/classes.dex" .
          zip -j base.apk classes.dex
          rm -f classes.dex
          cd -

          echo "[6/6] SIGNING APK..."
          keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=TV Admin, OU=Kafi, O=TVByKafi, L=Dhaka, ST=Dhaka, C=BD"

          $BUILD_TOOLS/apksigner sign \
              --ks release.keystore \
              --ks-key-alias release \
              --ks-pass pass:android123 \
              --key-pass pass:android123 \
              --out "$OUTPUT_APK" \
              "$BUILD/apk/base.apk"

          echo "BUILD SUCCESSFUL! APK: $OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVAdmin-debug
          path: TVAdmin.apk
